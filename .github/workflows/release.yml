name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.variant }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            variant: cpu
            dist_name: AmicoScript
            artifact_os: linux
          - os: windows-latest
            variant: cpu
            dist_name: AmicoScript
            artifact_os: windows
          - os: macos-latest
            variant: cpu
            dist_name: AmicoScript
            artifact_os: macos
          - os: windows-latest
            variant: gpu
            dist_name: AmicoScript-GPU
            artifact_os: windows-gpu
          - os: ubuntu-latest
            variant: gpu
            dist_name: AmicoScript-GPU
            artifact_os: linux-gpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.variant }}" = "gpu" ]; then
            pip install -r backend/requirements-gpu.txt
          else
            # On Linux the default PyPI torch wheel is the CUDA build, so a
            # plain `pip install torch` put several GB of nvidia libraries into
            # the *CPU* artifact — and made it nearly identical to the GPU one.
            # The Dockerfile already pins the CPU index for this reason.
            # Windows and macOS default to CPU-only wheels, so they are left be.
            if [ "${{ runner.os }}" = "Linux" ]; then
              pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            fi
            pip install -r backend/requirements.txt
          fi
          # Pulls pywebview (native window shell) on Windows/macOS only — the
          # marker skips Linux, where WebKitGTK lives in system packages that
          # PyInstaller cannot bundle. Linux builds ship in browser-fallback
          # mode; see docs/desktop-shell.md.
          pip install -r requirements-pyinstaller.txt
        shell: bash

      # Windows-only audio/tray deps for the embedded meeting watcher. Without
      # them package.py silently drops the watcher from the bundle and meeting
      # auto-capture is dead in the shipped app.
      - name: Install meeting-watcher dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install -r scripts/meeting_watcher/requirements.txt
        shell: bash

      - name: Build with PyInstaller
        run: |
          if [ "${{ matrix.variant }}" = "gpu" ]; then
            python package.py --gpu
          else
            python package.py
          fi
        shell: bash

      - name: Smoke test built artifact
        run: |
          if [ "${{ matrix.variant }}" = "gpu" ]; then
            AMICO_SMOKE_TIMEOUT=180 python scripts/smoke_test_bundle.py --gpu
          else
            AMICO_SMOKE_TIMEOUT=180 python scripts/smoke_test_bundle.py
          fi
        shell: bash

      - name: Create zip artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          pwsh -Command "if (-Not (Test-Path build\artifacts)) { New-Item -ItemType Directory -Path build\artifacts | Out-Null }; Compress-Archive -Path 'dist/${{ matrix.dist_name }}/*' -DestinationPath 'build\artifacts\AmicoScript-${{ github.ref_name }}-${{ matrix.artifact_os }}.zip' -Force"

      - name: Create zip artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/artifacts
          # Preserve .app bundle structure.
          ditto -c -k --keepParent "dist/AmicoScript.app" "build/artifacts/AmicoScript-${{ github.ref_name }}-macos.zip"
        shell: bash

      - name: Create zip artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/artifacts
          zip -r "build/artifacts/AmicoScript-${{ github.ref_name }}-${{ matrix.artifact_os }}.zip" dist/${{ matrix.dist_name }} || true
        shell: bash

      - name: Create GitHub Release and upload artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: build/artifacts/*.zip
          allowUpdates: true
          skipIfReleaseExists: false
