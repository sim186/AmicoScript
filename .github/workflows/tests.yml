name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # frontend/ is generated by this (the asset build) — nothing under
      # frontend/ is committed, so pytest's frontend asset checks and the
      # smoke tests below all need this to have run first.
      - name: Build the Web UI
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Run Web UI unit tests
        run: npm test --prefix web

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            tui/requirements.txt

      # Deliberately without backend/requirements-diarization.txt. The suite
      # stubs pyannote and torch where it needs them, and running it against a
      # machine that has neither is the same shape as the packaged app before
      # its first diarization — which is now a state worth covering rather than
      # an environment to avoid.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r tui/requirements.txt
          # ruff is pinned: an unpinned linter turns a release that adds a
          # rule into a red build on an unrelated pull request.
          pip install pytest httpx 'ruff>=0.15,<0.16'

      # Only the pyflakes rules (F): unused imports and unused locals, which is
      # what this is here to stop coming back — not style, which nothing in the
      # tree is currently formatted for. ruff rather than pyflakes itself
      # because the repo already carries `# noqa: F401` markers on the imports
      # that exist for their side effects (backend/db.py populating
      # SQLModel.metadata, the Windows-only watcher deps), and pyflakes does
      # not honour them.
      #
      # Notebooks are excluded: scripts/colab_bridge.ipynb runs in Colab, not
      # here, and its cells are written to be pasted around.
      - name: Lint
        run: |
          ruff check --select F --exclude '*.ipynb' \
            backend/ tui/ tests/ scripts/ run.py package.py package_interactive.py

      # The whole suite, not a hand-maintained list of files. The old workflow
      # named ten test files explicitly, so anything added since — including
      # every route-level test — was never run by CI.
      - name: Run tests
        run: pytest -q
